name: build-and-screenshot

# Builds the app using the native libraries (libmpv etc.) taken from the
# official release APK, so only the Kotlin/XML code is compiled here.
# Then boots an emulator and captures the home page and the General settings page.

on:
  # Manual only: Actions tab -> "build-and-screenshot" -> "Run workflow" (pick the branch)
  workflow_dispatch:

env:
  # Release whose native libs we reuse. Must match app/build.gradle versionName.
  LIBS_RELEASE: "2026-09-17"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch prebuilt native libs from the official release
        run: |
          set -e
          for abi in x86_64 armeabi-v7a; do   # x86_64 = emulator (screenshots), armeabi-v7a = your phone
            curl -fL "https://github.com/mpv-android/mpv-android/releases/download/${LIBS_RELEASE}/app-default-${abi}-release.apk" -o "$abi.apk"
            mkdir -p "app/src/main/libs/$abi"
            unzip -j -o "$abi.apk" "lib/$abi/*.so" -d "app/src/main/libs/$abi"
            ls -l "app/src/main/libs/$abi"
          done

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --no-daemon

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write screenshot script
        run: |
          cat > ci-screenshots.sh <<'EOF'
          #!/bin/bash
          set -u
          mkdir -p shots

          # tap <attribute> <regex>   e.g. tap resource-id 'settingsBtn$'
          # Dumps the UI, finds a matching node (case-insensitive), taps its centre.
          # Retries for ~40s. Returns 1 if the node never shows up.
          tap() {
            for i in $(seq 1 20); do
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml shots/ui_last.xml >/dev/null 2>&1
              xy=$(python3 - "$1" "$2" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          attr, pat = sys.argv[1], re.compile(sys.argv[2], re.I)
          try:
              root = ET.parse("shots/ui_last.xml").getroot()
          except Exception:
              sys.exit(0)
          for n in root.iter("node"):
              if pat.search(n.get(attr, "")):
                  m = re.findall(r"\d+", n.get("bounds", ""))
                  if len(m) == 4:
                      l, t, r, b = map(int, m)
                      print((l + r) // 2, (t + b) // 2)
                      break
          PY
              )
              if [ -n "$xy" ]; then
                adb shell input tap $xy
                return 0
              fi
              sleep 2
            done
            echo "Could not find $1 ~ $2"
            return 1
          }

          # waitfor <attribute> <regex>: same search, but do not tap
          waitfor() {
            for i in $(seq 1 20); do
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml shots/ui_last.xml >/dev/null 2>&1
              if python3 - "$1" "$2" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          attr, pat = sys.argv[1], re.compile(sys.argv[2], re.I)
          try:
              root = ET.parse("shots/ui_last.xml").getroot()
          except Exception:
              sys.exit(1)
          sys.exit(0 if any(pat.search(n.get(attr, "")) for n in root.iter("node")) else 1)
          PY
              then return 0; fi
              sleep 2
            done
            echo "Never saw $1 ~ $2"
            return 1
          }

          adb install -r app/build/outputs/apk/default/debug/app-default-x86_64-debug.apk || exit 1
          adb shell am start -n is.xyz.mpv/.MainActivity
          sleep 5

          key() { adb shell input keyevent "$1"; sleep 1.5; }
          shot() { adb exec-out screencap -p > "shots/$1.png"; }
          rotate() { # 0 = portrait, 1 = landscape
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation "$1"
            sleep 3
          }

          # Home page (light, portrait)
          waitfor resource-id 'settingsBtn$' || exit 1
          sleep 1
          shot home

          # General settings page (light)
          tap resource-id 'settingsBtn$' || exit 1
          tap text '^General$' || exit 1
          waitfor text 'Material You' || exit 1
          sleep 1
          shot general_settings

          # Back to the home page
          key KEYCODE_BACK
          key KEYCODE_BACK
          waitfor resource-id 'settingsBtn$' || exit 1

          # Home page (dark), plus the D-pad / TV-remote focus highlight
          adb shell cmd uimode night yes
          sleep 3
          waitfor resource-id 'settingsBtn$' || exit 1
          sleep 1
          shot home_dark
          key KEYCODE_DPAD_DOWN
          shot home_dark_focus
          # A touch (on the non-clickable logo) leaves keyboard-navigation mode, so the
          # next screenshots show the normal touch-mode look without a focus outline
          tap resource-id 'logo$' || exit 1
          sleep 1

          # Landscape (dark), without and with focus
          rotate 1
          waitfor resource-id 'settingsBtn$' || exit 1
          sleep 1
          shot home_dark_landscape
          key KEYCODE_DPAD_DOWN
          shot home_dark_landscape_focus
          tap resource-id 'logo$' || exit 1
          sleep 1

          # Landscape (light)
          adb shell cmd uimode night no
          sleep 3
          waitfor resource-id 'settingsBtn$' || exit 1
          sleep 1
          shot home_landscape

          rotate 0

          ls -l shots
          EOF

      - name: Run emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./ci-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn

      - name: Upload APK for the phone (armeabi-v7a)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-armeabi-v7a
          # the x86_64 and universal APKs are also built, but only this one is needed for the phone
          path: app/build/outputs/apk/default/debug/*armeabi-v7a*.apk
          if-no-files-found: warn
